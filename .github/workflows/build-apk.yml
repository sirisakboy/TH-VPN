name: Android CI/CD - TH-VPN Auto Build & Release

on:
  push:
    branches: [ "main", "master", "arena/**" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🚀 Build TH-VPN APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 🛠️ Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: 🔑 Setup Android Keystore (Auto-Generate)
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=THVPN,O=FreeNetTH,C=TH" \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          echo "✅ Keystore ready"

      - name: 📦 Build Android APK (${{ github.event.inputs.build_type || 'release' }})
        run: |
          BUILD_CHOICE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_CHOICE" = "debug" ]; then
            ./gradlew assembleDebug --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          else
            ./gradlew assembleRelease --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          fi

      - name: 🏷️ Collect & Rename Output APKs
        id: package_apk
        run: |
          mkdir -p output_apks
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')

          FOUND_APK=0
          for apk in $(find app/build/outputs/apk -name "*.apk" 2>/dev/null); do
            VARIANT=$(basename $(dirname "$apk"))
            TARGET_NAME="TH-VPN-${VARIANT}-${TIMESTAMP}-${SHORT_SHA}.apk"
            cp "$apk" "output_apks/${TARGET_NAME}"
            echo "✅ Packaged: ${TARGET_NAME}"
            FOUND_APK=1
          done

          if [ $FOUND_APK -eq 0 ]; then
            echo "❌ No APK files found!"
            exit 1
          fi

          PRIMARY_APK=$(ls output_apks/*.apk | head -n 1)
          echo "primary_name=$(basename ${PRIMARY_APK})" >> $GITHUB_OUTPUT

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TH-VPN-APK-${{ github.run_number }}
          path: output_apks/*.apk
          retention-days: 7

      - name: 🚀 Auto-Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          tag_name: thvpn-build-${{ github.run_number }}
          name: "TH-VPN Free-Net Edition Build #${{ github.run_number }}"
          body: |
            ### 🛡️ TH-VPN (Thai Free-Net & SIM Promo Edition) Build #${{ github.run_number }}
            - **Protocols**: Xray-core (VLESS / VMess / Trojan / Shadowsocks / WS + TLS SNI / Reality), SSH2 + SSL/WS Payload Injector, OpenVPN3 Native (`libovpncli.so`)
            - **Thai Carrier Presets**: AIS Play, AIS Free-Net, True เรียนฟรี/VDO, True Viber/Twitter/TrueID/NoPro, DTAC Gaming/NoPro, My by NT NoPro
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: ${{ github.sha }}

            📥 ดาวน์โหลดไฟล์ APK ด้านล่างเพื่อติดตั้งบนมือถือ Android ได้เลย!
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
