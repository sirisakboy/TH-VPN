name: Android CI/CD - TH-VPN Auto Build & Release

on:
  push:
    branches: [ "main", "master", "arena/**" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🚀 Build TH-VPN APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OAUTH_SIGNING_SHA1: ${{ vars.OAUTH_SIGNING_SHA1 }}
      OAUTH_SIGNING_SHA256: ${{ vars.OAUTH_SIGNING_SHA256 }}

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 🛠️ Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Configure optional Firebase project
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
          else
            echo "Firebase configuration absent: building local VPN mode (Drive OAuth is separate)."
          fi

      - name: Configure signing (secrets only)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Tagged releases require permanent signing secrets."
            exit 1
          else
            echo "::warning::Development signing only; OAuth certificate binding and upgrade compatibility are not guaranteed."
            echo "permanent=false" >> "$GITHUB_OUTPUT"
          fi
          # Debug tests and development artifacts use an ephemeral key, never a key stored in Git.
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=THVPN Development" -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 3650

      - name: Unit tests (route retry, cancellation and report privacy)
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-configuration-cache 2>&1 | tee gradle_build.log

      - name: 📦 Build Android APK (${{ github.event.inputs.build_type || 'release' }})
        run: |
          set -o pipefail
          BUILD_CHOICE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_CHOICE" = "debug" ]; then
            ./gradlew assembleDebug --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" 2>&1 | tee gradle_build.log
          else
            ./gradlew assembleRelease --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" 2>&1 | tee gradle_build.log
          fi

      - name: 🩺 Emit ErrorAnnotations on Failure
        if: failure()
        run: |
          echo "=== GRADLE FAILURE SUMMARY ==="
          grep -E "(^e: |error:|FAILURE:|What went wrong:|^\* |> Task .* FAILED|Caused by:)" -A 3 gradle_build.log | tail -n 80 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: 🏷️ Collect & Rename Output APKs
        id: package_apk
        run: |
          mkdir -p output_apks
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')

          FOUND_APK=0
          for apk in $(find app/build/outputs/apk -name "*.apk" 2>/dev/null); do
            VARIANT=$(basename $(dirname "$apk"))
            TARGET_NAME="TH-VPN-${VARIANT}-${TIMESTAMP}-${SHORT_SHA}.apk"
            cp "$apk" "output_apks/${TARGET_NAME}"
            echo "✅ Packaged: ${TARGET_NAME}"
            FOUND_APK=1
          done

          if [ $FOUND_APK -eq 0 ]; then
            echo "❌ No APK files found!"
            exit 1
          fi

          PRIMARY_APK=$(ls output_apks/*.apk | head -n 1)
          echo "primary_name=$(basename ${PRIMARY_APK})" >> $GITHUB_OUTPUT

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TH-VPN-APK-${{ github.run_number }}
          path: output_apks/*.apk
          retention-days: 7

      - name: 🚀 Auto-Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success() && steps.signing.outputs.permanent == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          tag_name: thvpn-build-${{ github.run_number }}
          name: "TH-VPN Free-Net Edition Build #${{ github.run_number }}"
          body: |
            ### 🛡️ TH-VPN (Thai Free-Net & SIM Promo Edition) Build #${{ github.run_number }}
            - **Protocols**: Xray-core (VLESS / VMess / Trojan / Shadowsocks / WS + TLS SNI / Reality), SSH2 + SSL/WS Payload Injector, OpenVPN3 Native (`libovpncli.so`)
            - **Thai Carrier Presets**: AIS Play, AIS Free-Net, True เรียนฟรี/VDO, True Viber/Twitter/TrueID/NoPro, DTAC Gaming/NoPro, My by NT NoPro
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: ${{ github.sha }}

            📥 ดาวน์โหลดไฟล์ APK ด้านล่างเพื่อติดตั้งบนมือถือ Android ได้เลย!
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
